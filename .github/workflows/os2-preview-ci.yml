name: OS2 Preview CI

on:
  push:
    branches:
      - agent/talk2me-os2-integrated-rebuild
    paths:
      - 'os2-preview/**'
      - 'public/os2/**'
      - '.github/workflows/os2-preview-ci.yml'
  pull_request:
    paths:
      - 'os2-preview/**'
      - 'public/os2/**'
      - '.github/workflows/os2-preview-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: os2-preview-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate OS2 preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: os2-preview
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: os2-preview/package.json

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run integrated validation suite
        run: npm run check

      - name: Run dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Generate build evidence
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: npm run evidence:build

      - name: Upload build evidence
        uses: actions/upload-artifact@v4
        with:
          name: os2-preview-build-evidence-${{ github.run_number }}
          path: os2-preview/build-evidence
          if-no-files-found: error
          retention-days: 30
