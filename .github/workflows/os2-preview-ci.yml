name: OS2 Preview CI

on:
  push:
    branches:
      - agent/talk2me-os2-integrated-rebuild
    paths:
      - 'os2-preview/**'
      - 'public/os2/**'
      - '.github/workflows/os2-preview-ci.yml'
      - '.github/workflows/os2-dependency-lock-generation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: os2-preview-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate OS2 preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: os2-preview
    steps:
      - name: Checkout repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Confirm controlled workflow event and ref
        shell: bash
        run: |
          case "$GITHUB_EVENT_NAME" in
            push|workflow_dispatch) ;;
            *) echo "Unsupported workflow event: $GITHUB_EVENT_NAME" >&2; exit 1 ;;
          esac
          test "$GITHUB_REPOSITORY" = "SjlerAi/talk2me"
          test "$GITHUB_REF" = "refs/heads/agent/talk2me-os2-integrated-rebuild"
          test "$GITHUB_REF_NAME" = "agent/talk2me-os2-integrated-rebuild"
          test -n "$GITHUB_SHA"

      - name: Verify committed dependency lock
        env:
          PREVIEW_APP_ROOT: ${{ github.workspace }}/os2-preview
          DB_NAME: kloka_talk2me
          RELEASE_BRANCH: agent/talk2me-os2-integrated-rebuild
          ALLOW_PRODUCTION_MUTATION: 'false'
          ENABLE_CUSTOMER_MERGE_EXECUTION: 'false'
        run: node dependency-lock-verification.js

      - name: Verify dependency lock governance
        run: node dependency-lock-governance-check.js

      - name: Verify and retain pre-install workspace source integrity
        id: preinstall-source
        env:
          PREVIEW_APP_ROOT: ${{ github.workspace }}/os2-preview
          DB_NAME: kloka_talk2me
          RELEASE_BRANCH: agent/talk2me-os2-integrated-rebuild
          ALLOW_PRODUCTION_MUTATION: 'false'
          ENABLE_CUSTOMER_MERGE_EXECUTION: 'false'
        shell: bash
        run: |
          evidence_file="$RUNNER_TEMP/os2-workspace-source-integrity-preinstall.json"
          npm run --silent verify:workspace-source-integrity > "$evidence_file"
          cat "$evidence_file"
          node -e '
            const fs = require("fs");
            const evidence = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (evidence.ok !== true || !/^[0-9a-f]{64}$/i.test(String(evidence.inventorySha256 || ""))) {
              throw new Error("Pre-install source-integrity evidence is incomplete");
            }
            if (evidence.packageLockPresent !== true) {
              throw new Error("Committed dependency lock is required in source-integrity evidence");
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `inventory_sha256=${String(evidence.inventorySha256).toLowerCase()}\n`);
          ' "$evidence_file"

      - name: Install dependencies from committed lock
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run integrated validation suite
        run: npm run check

      - name: Run production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Generate build evidence with pre-install source continuity
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_ACTOR: ${{ github.actor }}
          DEPENDENCY_LOCK_PRESENT: 'true'
          EXPECTED_PREINSTALL_SOURCE_INVENTORY_SHA256: ${{ steps.preinstall-source.outputs.inventory_sha256 }}
          PREVIEW_APP_ROOT: ${{ github.workspace }}/os2-preview
          DB_NAME: kloka_talk2me
          RELEASE_BRANCH: agent/talk2me-os2-integrated-rebuild
          ALLOW_PRODUCTION_MUTATION: 'false'
          ENABLE_CUSTOMER_MERGE_EXECUTION: 'false'
        run: npm run evidence:build

      - name: Upload build evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: os2-preview-build-evidence-${{ github.run_number }}-attempt-${{ github.run_attempt }}
          path: os2-preview/build-evidence
          if-no-files-found: error
          retention-days: 30
