name: OS2 Preview CI

on:
  push:
    branches:
      - agent/talk2me-os2-integrated-rebuild
    paths:
      - 'os2-preview/**'
      - 'public/os2/**'
      - '.github/workflows/os2-preview-ci.yml'
  pull_request:
    paths:
      - 'os2-preview/**'
      - 'public/os2/**'
      - '.github/workflows/os2-preview-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: os2-preview-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate OS2 preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: os2-preview
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Detect dependency lock
        id: dependency-lock
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::package-lock.json is absent. Source validation will continue, dependency audit and release-candidate freeze remain blocked."
          fi

      - name: Verify deterministic workspace source integrity
        env:
          PREVIEW_APP_ROOT: ${{ github.workspace }}/os2-preview
          DB_NAME: kloka_talk2me
          RELEASE_BRANCH: agent/talk2me-os2-integrated-rebuild
          ALLOW_PRODUCTION_MUTATION: 'false'
          ENABLE_CUSTOMER_MERGE_EXECUTION: 'false'
        run: npm run verify:workspace-source-integrity

      - name: Install dependencies without changing repository lock state
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Run integrated validation suite
        run: npm run check

      - name: Run dependency audit
        if: steps.dependency-lock.outputs.present == 'true'
        run: npm audit --omit=dev --audit-level=high

      - name: Record dependency audit blocker
        if: steps.dependency-lock.outputs.present != 'true'
        shell: bash
        run: |
          echo "### Dependency audit blocked" >> "$GITHUB_STEP_SUMMARY"
          echo "A committed os2-preview/package-lock.json is required before dependency audit and release-candidate freeze." >> "$GITHUB_STEP_SUMMARY"

      - name: Generate build evidence with source-integrity binding
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          DEPENDENCY_LOCK_PRESENT: ${{ steps.dependency-lock.outputs.present }}
          PREVIEW_APP_ROOT: ${{ github.workspace }}/os2-preview
          DB_NAME: kloka_talk2me
          RELEASE_BRANCH: agent/talk2me-os2-integrated-rebuild
          ALLOW_PRODUCTION_MUTATION: 'false'
          ENABLE_CUSTOMER_MERGE_EXECUTION: 'false'
        run: npm run evidence:build

      - name: Upload build evidence
        uses: actions/upload-artifact@v4
        with:
          name: os2-preview-build-evidence-${{ github.run_number }}
          path: os2-preview/build-evidence
          if-no-files-found: error
          retention-days: 30
