name: Validate Base Details foundation

on:
  pull_request:
    paths:
      - 'src/services/monthly-import-parser.js'
      - 'src/services/monthly-import-matcher.js'
      - 'src/services/base-details-reconciliation.js'
      - 'src/services/base-details-stager.js'
      - 'src/services/base-details-account-unifier.js'
      - 'src/services/mobile-event-ledger.js'
      - 'src/routes/base-details-centre.js'
      - 'src/routes.js'
      - 'views/base-details-centre.ejs'
      - 'scripts/validate-base-details-foundation.js'
      - 'scripts/validate-base-details-reconciliation.js'
      - 'scripts/validate-base-details-operations.js'
      - 'sql/ONE_OFF_110_base_details_master_foundation.sql'
      - '.github/workflows/base-details-foundation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-base-details:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --check src/services/monthly-import-parser.js
      - run: node --check src/services/base-details-reconciliation.js
      - run: node --check src/services/base-details-stager.js
      - run: node --check src/services/base-details-account-unifier.js
      - run: node --check src/services/mobile-event-ledger.js
      - run: node --check src/services/monthly-import-matcher.js
      - run: node --check src/routes/base-details-centre.js
      - run: node --check scripts/validate-base-details-foundation.js
      - run: node --check scripts/validate-base-details-reconciliation.js
      - run: node --check scripts/validate-base-details-operations.js
      - run: node scripts/validate-base-details-foundation.js
      - run: node scripts/validate-base-details-reconciliation.js
      - run: node scripts/validate-base-details-operations.js
      - name: Guard one-off SQL safety boundary
        run: |
          grep -q "Do NOT run npm run db:migrate" sql/ONE_OFF_110_base_details_master_foundation.sql
          grep -q "CREATE TABLE IF NOT EXISTS mobile_base_current" sql/ONE_OFF_110_base_details_master_foundation.sql
          grep -q "CREATE TABLE IF NOT EXISTS mobile_base_snapshots" sql/ONE_OFF_110_base_details_master_foundation.sql
          grep -q "CREATE TABLE IF NOT EXISTS mobile_events" sql/ONE_OFF_110_base_details_master_foundation.sql
          grep -q "CREATE TABLE IF NOT EXISTS staff_external_codes" sql/ONE_OFF_110_base_details_master_foundation.sql
      - name: Guard Base Details staging-only boundary
        run: |
          grep -q "stage_base_existing_client" src/services/base-details-reconciliation.js
          grep -q "stage_base_account_conflict" src/services/base-details-reconciliation.js
          ! grep -q "actionType: 'create_mobile_record'" src/services/base-details-reconciliation.js
          ! grep -q "actionType: 'link_mobile_client'" src/services/base-details-reconciliation.js
      - name: Guard monthly current-base protection
        run: |
          grep -q "link_existing_mobile_base" src/services/monthly-import-matcher.js
          grep -q "currentMobileByPhone" src/services/monthly-import-matcher.js
