name: Talk2Me deployment diagnostics

on:
  push:
    branches:
      - chat/deploy-diagnostics

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: talk2me-uat
    env:
      SSH_HOST: 164.160.91.40
      SSH_PORT: '41414'
      SSH_USER: uent
      ELITEHOST_SSH_PRIVATE_KEY: ${{ secrets.ELITEHOST_SSH_PRIVATE_KEY }}
      ELITEHOST_SSH_KEY_PASSPHRASE: ${{ secrets.ELITEHOST_SSH_KEY_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v6
      - name: Configure encrypted SSH key
        run: bash scripts/setup-elitehost-ssh.sh
      - name: Inspect deployment state only
        shell: bash
        run: |
          set -Eeuo pipefail
          echo '--- public health ---'
          curl -LfsS --connect-timeout 10 --max-time 25 https://talk2me.uent.co.za/api/health || true
          echo
          echo '--- public release ---'
          curl -LfsS --connect-timeout 10 --max-time 25 https://talk2me.uent.co.za/api/release || true
          echo
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'set -eu; echo "--- deployed marker ---"; cat /home/uent/talk2me.uent.co.za/.deployed_commit 2>/dev/null || true; echo "--- release manifest ---"; cat /home/uent/talk2me.uent.co.za/.talk2me-release.json 2>/dev/null || true; echo "--- agent last request ---"; cat /home/uent/.talk2me-deploy/last-request.json 2>/dev/null || true; echo "--- agent last success ---"; cat /home/uent/.talk2me-deploy/last-success.json 2>/dev/null || true; echo "--- control status ---"; cat /home/uent/talk2me-deploy-control/deploy/uat.json 2>/dev/null || true; echo "--- agent lock ---"; ls -ld /home/uent/.talk2me-deploy/agent.lock 2>/dev/null || true; echo "--- cron tail ---"; tail -n 120 /home/uent/.talk2me-deploy/cron.log 2>/dev/null || true; echo "--- Passenger stderr tail ---"; tail -n 80 /home/uent/talk2me.uent.co.za/stderr.log 2>/dev/null || true'
