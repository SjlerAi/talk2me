name: Talk2Me deployment diagnostics

on:
  push:
    branches:
      - chat/deploy-diagnostics

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: talk2me-uat
    env:
      SSH_HOST: 164.160.91.40
      SSH_PORT: "41414"
      SSH_USER: uent
      ELITEHOST_SSH_PRIVATE_KEY: ${{ secrets.ELITEHOST_SSH_PRIVATE_KEY }}
      ELITEHOST_SSH_KEY_PASSPHRASE: ${{ secrets.ELITEHOST_SSH_KEY_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v6
      - name: Configure encrypted SSH key
        run: bash scripts/setup-elitehost-ssh.sh
      - name: Inspect existing Deployment Bible agent state
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'printf "%s\n" "--- agent status ---"; /home/uent/bin/talk2me-uat-agent --status 2>&1 || true; printf "%s\n" "--- last request ---"; cat /home/uent/.talk2me-deploy/last-request.json 2>/dev/null || true; printf "%s\n" "--- deployed release ---"; cat /home/uent/talk2me.uent.co.za/.talk2me-release.json 2>/dev/null || true; printf "%s\n" "--- recent agent log ---"; tail -n 80 /home/uent/.talk2me-deploy/cron.log 2>/dev/null || true'
      - name: Inspect public release
        run: |
          curl -LfsS --connect-timeout 10 --max-time 25 https://talk2me.uent.co.za/api/health || true
          printf '\n'
          curl -LfsS --connect-timeout 10 --max-time 25 https://talk2me.uent.co.za/api/release || true
          printf '\n'
