name: Talk2Me deployment diagnostics

on:
  push:
    branches:
      - chat/deploy-diagnostics

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: talk2me-uat
    env:
      SSH_HOST: 164.160.91.40
      SSH_PORT: "41414"
      SSH_USER: uent
      EXPECTED_RELEASE: 5fa63c5f6ab8d7a19befc808829fe2ee247d560f
      ELITEHOST_SSH_PRIVATE_KEY: ${{ secrets.ELITEHOST_SSH_PRIVATE_KEY }}
      ELITEHOST_SSH_KEY_PASSPHRASE: ${{ secrets.ELITEHOST_SSH_KEY_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v6
      - name: Configure encrypted SSH key
        run: bash scripts/setup-elitehost-ssh.sh
      - name: Verify exact deployed release
        run: |
          live="$(curl -LfsS --connect-timeout 10 --max-time 25 https://talk2me.uent.co.za/api/release)"
          LIVE_RELEASE="$live" node - <<'NODE'
          const release = JSON.parse(process.env.LIVE_RELEASE || '{}');
          if (release.commit !== process.env.EXPECTED_RELEASE) {
            console.error(`Expected ${process.env.EXPECTED_RELEASE}, got ${release.commit || 'unknown'}`);
            process.exit(1);
          }
          console.log(`Verified live release ${release.commit}`);
          NODE
      - name: Send forced staff action brief test
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'DIGEST_FORCE_SEND=1 /bin/bash /home/uent/bin/talk2me-staff-work'
      - name: Send forced owner daily brief test
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'DIGEST_FORCE_SEND=1 /bin/bash /home/uent/bin/talk2me-owner-brief'
