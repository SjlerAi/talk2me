name: OS2 Preview Validation

on:
  push:
    branches:
      - agent/talk2me-os2-integrated-rebuild
    paths:
      - 'os2-preview/**'
      - '.github/workflows/os2-preview-validation.yml'
  pull_request:
    branches:
      - agent/talk2me-os2-foundation
    paths:
      - 'os2-preview/**'
      - '.github/workflows/os2-preview-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: os2-preview-validation-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  source-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: os2-preview
    steps:
      - name: Check out controlled branch
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: os2-preview/package.json

      - name: Confirm controlled source identity
        shell: bash
        env:
          CONTROLLED_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -euo pipefail
          test "$CONTROLLED_BRANCH" = "agent/talk2me-os2-integrated-rebuild"
          test "$(node -p "require('./package.json').version")" = "0.60.0"
          printf 'branch=%s\ncommit=%s\nnode=%s\nnpm=%s\n' "$CONTROLLED_BRANCH" "$GITHUB_SHA" "$(node --version)" "$(npm --version)"

      - name: Install dependencies without lifecycle scripts
        shell: bash
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Record known dependency-lock source drift
        shell: bash
        run: |
          set -euo pipefail
          grep -F "expectedVersion = '0.59.0'" dependency-lock-verification.js
          grep -F "expectedVersion = '0.59.0'" dependency-lock-governance-check.js
          grep -F "'PACKAGE_JSON_NOT_REGULAR_FILE', 'PACKAGE_LOCK_NOT_REGULAR_FILE'" dependency-lock-governance-check.js
          printf '%s\n' 'Known source defects confirmed: stale 0.59.0 lock identity and literal marker mismatch.'

      - name: Apply diagnostic compatibility patch in runner workspace only
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          for (const file of ['dependency-lock-verification.js', 'dependency-lock-governance-check.js']) {
            let source = fs.readFileSync(file, 'utf8');
            source = source.replace("expectedVersion = '0.59.0'", "expectedVersion = '0.60.0'");
            if (file === 'dependency-lock-governance-check.js') {
              source = source.replace("'PACKAGE_JSON_NOT_REGULAR_FILE', 'PACKAGE_LOCK_NOT_REGULAR_FILE',", "'${label}_NOT_REGULAR_FILE',");
            }
            fs.writeFileSync(file, source);
          }
          NODE
          printf '%s\n' 'Diagnostic patch is temporary and is not committed or uploaded as source.'

      - name: Run complete source validation after known-drift isolation
        shell: bash
        run: npm run check

      - name: Record generated dependency lock metadata
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if test -f package-lock.json; then
            node -e "const fs=require('fs');const crypto=require('crypto');const b=fs.readFileSync('package-lock.json');console.log(JSON.stringify({file:'package-lock.json',bytes:b.length,sha256:crypto.createHash('sha256').update(b).digest('hex')},null,2))" | tee dependency-lock-metadata.json
          else
            printf '%s\n' '{"file":"package-lock.json","generated":false}' | tee dependency-lock-metadata.json
          fi

      - name: Record diagnostic workspace changes
        if: always()
        shell: bash
        run: git diff -- dependency-lock-verification.js dependency-lock-governance-check.js || true

      - name: Upload temporary dependency-lock evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: os2-preview-dependency-lock-evidence-${{ github.sha }}
          path: |
            os2-preview/package-lock.json
            os2-preview/dependency-lock-metadata.json
          if-no-files-found: warn
          retention-days: 7

      - name: Confirm no database or deployment execution
        if: always()
        shell: bash
        run: |
          printf '%s\n' 'Source validation only: no database credentials supplied, no migrations executed, no worker started, no deployment or restart performed.'
