name: Apply Base Details database foundation

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/apply-base-details-foundation-db.js'
      - '.github/workflows/apply-base-details-foundation-db.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: talk2me-base-details-db-foundation
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    environment:
      name: talk2me-uat
      url: https://talk2me.uent.co.za
    env:
      SSH_HOST: 164.160.91.40
      SSH_PORT: '41414'
      SSH_USER: uent
      SITE_URL: https://talk2me.uent.co.za
      NODE_BIN: /opt/alt/alt-nodejs20/root/usr/bin/node
      PRIVATE_DB_OPS: /home/uent/.config/talk2me/db-ops
      ELITEHOST_SSH_PRIVATE_KEY: ${{ secrets.ELITEHOST_SSH_PRIVATE_KEY }}
      ELITEHOST_SSH_KEY_PASSPHRASE: ${{ secrets.ELITEHOST_SSH_KEY_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v6

      - name: Validate reviewed inputs
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f sql/ONE_OFF_110_base_details_master_foundation.sql
          test -f sql/ONE_OFF_110A_staff_contact_seed.sql
          test -f scripts/apply-base-details-foundation-db.js
          grep -q 'Do NOT run npm run db:migrate' sql/ONE_OFF_110_base_details_master_foundation.sql
          grep -q 'CREATE TABLE IF NOT EXISTS mobile_base_current' sql/ONE_OFF_110_base_details_master_foundation.sql
          grep -q 'CREATE TABLE IF NOT EXISTS mobile_base_snapshots' sql/ONE_OFF_110_base_details_master_foundation.sql
          grep -q 'CREATE TABLE IF NOT EXISTS mobile_events' sql/ONE_OFF_110_base_details_master_foundation.sql
          grep -q 'CREATE TABLE IF NOT EXISTS staff_external_codes' sql/ONE_OFF_110_base_details_master_foundation.sql
          grep -q "COALESCE(NULLIF(TRIM(contact_number),'')" sql/ONE_OFF_110A_staff_contact_seed.sql
          node --check scripts/apply-base-details-foundation-db.js

      - name: Configure encrypted SSH key
        run: bash scripts/setup-elitehost-ssh.sh

      - name: Wait for exact application release
        timeout-minutes: 30
        shell: bash
        run: |
          set -Eeuo pipefail
          for attempt in $(seq 1 120); do
            release="$(curl -fsS --connect-timeout 10 --max-time 20 "$SITE_URL/api/release" 2>/dev/null || true)"
            if RELEASE="$release" EXPECTED_COMMIT="$GITHUB_SHA" node - <<'NODE'
          try {
            const value = JSON.parse(process.env.RELEASE || '{}');
            process.exit(value.commit === process.env.EXPECTED_COMMIT ? 0 : 1);
          } catch { process.exit(1); }
          NODE
            then
              echo "Exact application release $GITHUB_SHA is live; database operation may proceed."
              exit 0
            fi
            echo "Waiting for exact release $GITHUB_SHA (attempt $attempt/120)..."
            sleep 15
          done
          echo 'Exact application release was not proven; database operation was not attempted.' >&2
          exit 1

      - name: Verify deployed helper identity
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" bash -s -- "$GITHUB_SHA" <<'REMOTE'
          set -Eeuo pipefail
          expected_sha="$1"
          app=/home/uent/talk2me.uent.co.za
          test "$(tr -d '[:space:]' < "$app/.deployed_commit")" = "$expected_sha"
          test -f "$app/.talk2me-release.json"
          test -f "$app/scripts/apply-base-details-foundation-db.js"
          grep -q 'createServerBackup' "$app/scripts/apply-base-details-foundation-db.js"
          grep -q 'Core Talk2Me row counts changed' "$app/scripts/apply-base-details-foundation-db.js"
          REMOTE

      - name: Transfer reviewed SQL to private operation directory
        shell: bash
        run: |
          set -Eeuo pipefail
          short="${GITHUB_SHA:0:12}"
          foundation="$PRIVATE_DB_OPS/ONE_OFF_110_base_details_master_foundation-$short.sql"
          staff="$PRIVATE_DB_OPS/ONE_OFF_110A_staff_contact_seed-$short.sql"
          printf 'FOUNDATION_REMOTE=%s\nSTAFF_REMOTE=%s\n' "$foundation" "$staff" >> "$GITHUB_ENV"
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "mkdir -p '$PRIVATE_DB_OPS' && chmod 700 '$PRIVATE_DB_OPS'"
          scp -P "$SSH_PORT" sql/ONE_OFF_110_base_details_master_foundation.sql "$SSH_USER@$SSH_HOST:$foundation"
          scp -P "$SSH_PORT" sql/ONE_OFF_110A_staff_contact_seed.sql "$SSH_USER@$SSH_HOST:$staff"
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "chmod 600 '$foundation' '$staff'"

      - name: Apply reviewed database foundation
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" bash -s -- "$FOUNDATION_REMOTE" "$STAFF_REMOTE" "$GITHUB_SHA" "$NODE_BIN" <<'REMOTE'
          set -Eeuo pipefail
          foundation="$1"
          staff="$2"
          expected_sha="$3"
          node_bin="$4"
          cd /home/uent/talk2me.uent.co.za
          "$node_bin" scripts/apply-base-details-foundation-db.js "$foundation" "$staff" "$expected_sha"
          REMOTE

      - name: Verify public application health after DB operation
        shell: bash
        run: |
          set -Eeuo pipefail
          health="$(curl -fsS --connect-timeout 10 --max-time 25 "$SITE_URL/api/health")"
          release="$(curl -fsS --connect-timeout 10 --max-time 25 "$SITE_URL/api/release")"
          HEALTH="$health" RELEASE="$release" EXPECTED_COMMIT="$GITHUB_SHA" node - <<'NODE'
          const health = JSON.parse(process.env.HEALTH || '{}');
          const release = JSON.parse(process.env.RELEASE || '{}');
          if (health.status !== 'ok' || release.commit !== process.env.EXPECTED_COMMIT) process.exit(1);
          console.log(`Talk2Me is healthy on exact release ${release.commit}.`);
          NODE

      - name: Remove temporary SQL copies
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          if [ -n "${FOUNDATION_REMOTE:-}" ] || [ -n "${STAFF_REMOTE:-}" ]; then
            ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "rm -f '${FOUNDATION_REMOTE:-/dev/null}' '${STAFF_REMOTE:-/dev/null}'" || true
          fi
