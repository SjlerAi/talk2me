name: Base Details live cleanup

on:
  pull_request:
    paths:
      - 'scripts/run-base-details-live-cleanup.js'
      - '.github/workflows/base-details-live-cleanup.yml'
  push:
    branches:
      - main
    paths:
      - 'scripts/run-base-details-live-cleanup.js'
      - '.github/workflows/base-details-live-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: talk2me-base-details-live-cleanup-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --check scripts/run-base-details-live-cleanup.js
      - name: Guard cleanup safety boundaries
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -q "GERDA_CODE = 'LEROUXG02_C3D'" scripts/run-base-details-live-cleanup.js
          grep -q "GERDA_EMAIL = 'gerda@talk-online.co.za'" scripts/run-base-details-live-cleanup.js
          grep -q 'createServerBackup' scripts/run-base-details-live-cleanup.js
          grep -q 'rematchPendingMobileImports' scripts/run-base-details-live-cleanup.js
          grep -q 'syncMobileEvents' scripts/run-base-details-live-cleanup.js
          grep -q 'assertSameProtectedCounts' scripts/run-base-details-live-cleanup.js
          ! grep -q 'DELETE FROM clients' scripts/run-base-details-live-cleanup.js
          ! grep -q 'UPDATE clients' scripts/run-base-details-live-cleanup.js
          ! grep -q 'INSERT INTO clients' scripts/run-base-details-live-cleanup.js

  apply:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: talk2me-uat
      url: https://talk2me.uent.co.za
    env:
      SSH_HOST: 164.160.91.40
      SSH_PORT: '41414'
      SSH_USER: uent
      SITE_URL: https://talk2me.uent.co.za
      NODE_BIN: /opt/alt/alt-nodejs20/root/usr/bin/node
      ELITEHOST_SSH_PRIVATE_KEY: ${{ secrets.ELITEHOST_SSH_PRIVATE_KEY }}
      ELITEHOST_SSH_KEY_PASSPHRASE: ${{ secrets.ELITEHOST_SSH_KEY_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v6

      - name: Configure encrypted SSH key
        run: bash scripts/setup-elitehost-ssh.sh

      - name: Wait for exact application release
        timeout-minutes: 30
        shell: bash
        run: |
          set -Eeuo pipefail
          for attempt in $(seq 1 120); do
            health="$(curl -fsS --connect-timeout 10 --max-time 20 "$SITE_URL/api/health" 2>/dev/null || true)"
            release="$(curl -fsS --connect-timeout 10 --max-time 20 "$SITE_URL/api/release" 2>/dev/null || true)"
            if node scripts/verify-public-release.js "$health" "$release" "$GITHUB_SHA" "$GITHUB_RUN_ID"; then
              echo "Exact application release $GITHUB_SHA from workflow $GITHUB_RUN_ID is live; cleanup may proceed."
              exit 0
            fi
            echo "Waiting for exact release $GITHUB_SHA (attempt $attempt/120)..."
            sleep 15
          done
          echo 'Exact application release was not proven; cleanup was not attempted.' >&2
          exit 1

      - name: Verify deployed cleanup helper identity
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" bash -s -- "$GITHUB_SHA" <<'REMOTE'
          set -Eeuo pipefail
          expected_sha="$1"
          app=/home/uent/talk2me.uent.co.za
          test "$(tr -d '[:space:]' < "$app/.deployed_commit")" = "$expected_sha"
          test -f "$app/scripts/run-base-details-live-cleanup.js"
          grep -q "LEROUXG02_C3D" "$app/scripts/run-base-details-live-cleanup.js"
          grep -q 'assertSameProtectedCounts' "$app/scripts/run-base-details-live-cleanup.js"
          REMOTE

      - name: Run guarded live cleanup
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" bash -s -- "$GITHUB_SHA" "$NODE_BIN" <<'REMOTE'
          set -Eeuo pipefail
          expected_sha="$1"
          node_bin="$2"
          cd /home/uent/talk2me.uent.co.za
          "$node_bin" scripts/run-base-details-live-cleanup.js "$expected_sha"
          REMOTE

      - name: Verify public application health after cleanup
        shell: bash
        run: |
          set -Eeuo pipefail
          health="$(curl -fsS --connect-timeout 10 --max-time 25 "$SITE_URL/api/health")"
          release="$(curl -fsS --connect-timeout 10 --max-time 25 "$SITE_URL/api/release")"
          node scripts/verify-public-release.js "$health" "$release" "$GITHUB_SHA" "$GITHUB_RUN_ID"
