name: Repository Cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repository-cleanup.yml

permissions:
  contents: write
  actions: write
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Remove Actions artifacts older than 7 days
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -Eeuo pipefail
          cutoff="$(date -u -d '7 days ago' +%s)"
          page=1
          while :; do
            payload="$(gh api "repos/$REPO/actions/artifacts?per_page=100&page=$page")"
            count="$(jq '.artifacts | length' <<<"$payload")"
            [ "$count" -eq 0 ] && break

            jq -c '.artifacts[]' <<<"$payload" | while read -r artifact; do
              id="$(jq -r '.id' <<<"$artifact")"
              created="$(jq -r '.created_at' <<<"$artifact")"
              created_epoch="$(date -u -d "$created" +%s)"
              if [ "$created_epoch" -lt "$cutoff" ]; then
                echo "Deleting artifact $id older than 7 days"
                gh api --method DELETE "repos/$REPO/actions/artifacts/$id"
              fi
            done
            page=$((page + 1))
          done

      - name: Remove merged stale branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api --paginate "repos/$REPO/pulls?state=open&per_page=100" --jq '.[].head.ref' | sort -u > /tmp/open-pr-heads.txt

          page=1
          while :; do
            payload="$(gh api "repos/$REPO/branches?per_page=100&page=$page")"
            count="$(jq 'length' <<<"$payload")"
            [ "$count" -eq 0 ] && break

            jq -r '.[].name' <<<"$payload" | while read -r branch; do
              case "$branch" in
                main|master|develop|staging|deploy/*|release/*|rollback/*|recovery/*)
                  echo "Keeping protected branch: $branch"
                  continue
                  ;;
              esac

              if grep -Fxq "$branch" /tmp/open-pr-heads.txt; then
                echo "Keeping open-PR branch: $branch"
                continue
              fi

              encoded_branch="$(jq -rn --arg v "$branch" '$v|@uri')"
              ahead="$(gh api "repos/$REPO/compare/main...$encoded_branch" --jq '.ahead_by' 2>/dev/null || echo 1)"
              if [ "$ahead" = "0" ]; then
                encoded_ref="$(jq -rn --arg v "heads/$branch" '$v|@uri')"
                echo "Deleting merged branch: $branch"
                gh api --method DELETE "repos/$REPO/git/refs/$encoded_ref"
              else
                echo "Keeping branch with unique commits: $branch"
              fi
            done
            page=$((page + 1))
          done
