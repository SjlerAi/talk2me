name: Validate pending mobile re-match

on:
  pull_request:
    paths:
      - 'src/services/pending-mobile-rematcher.js'
      - 'src/routes/base-details-centre.js'
      - 'views/base-details-centre.ejs'
      - 'scripts/validate-pending-mobile-rematch.js'
      - '.github/workflows/validate-pending-mobile-rematch.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --check src/services/pending-mobile-rematcher.js
      - run: node --check src/routes/base-details-centre.js
      - run: node --check scripts/validate-pending-mobile-rematch.js
      - run: node scripts/validate-pending-mobile-rematch.js
