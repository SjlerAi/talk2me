name: Validate Staff import identities

on:
  pull_request:
    paths:
      - 'src/services/staff-external-codes.js'
      - 'src/routes/staff-import-identities.js'
      - 'src/routes.js'
      - 'views/staff-edit.ejs'
      - 'public/js/staff-import-identities.js'
      - 'sql/ONE_OFF_110_base_details_master_foundation.sql'
      - 'sql/ONE_OFF_110A_staff_contact_seed.sql'
      - 'scripts/validate-staff-import-identities.js'
      - '.github/workflows/staff-import-identities.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-staff-identities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --check src/services/staff-external-codes.js
      - run: node --check src/routes/staff-import-identities.js
      - run: node --check public/js/staff-import-identities.js
      - run: node --check scripts/validate-staff-import-identities.js
      - run: node scripts/validate-staff-import-identities.js
