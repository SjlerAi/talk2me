name: Base Details live cleanup v2

on:
  pull_request:
    paths:
      - 'scripts/run-base-details-live-cleanup.js'
      - '.github/workflows/base-details-live-cleanup-v2.yml'
  push:
    branches:
      - main
    paths:
      - 'scripts/run-base-details-live-cleanup.js'
      - '.github/workflows/base-details-live-cleanup-v2.yml'

permissions:
  contents: read

concurrency:
  group: talk2me-base-details-live-cleanup-v2-${{ github.sha }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --check scripts/run-base-details-live-cleanup.js
      - name: Guard safety boundary
        run: |
          set -Eeuo pipefail
          grep -q "GERDA_CODE = 'LEROUXG02_C3D'" scripts/run-base-details-live-cleanup.js
          grep -q "GERDA_EMAIL = 'gerda@talk-online.co.za'" scripts/run-base-details-live-cleanup.js
          grep -q 'createServerBackup' scripts/run-base-details-live-cleanup.js
          grep -q 'assertSameProtectedCounts' scripts/run-base-details-live-cleanup.js
          ! grep -q 'DELETE FROM clients' scripts/run-base-details-live-cleanup.js
          ! grep -q 'UPDATE clients' scripts/run-base-details-live-cleanup.js
          ! grep -q 'INSERT INTO clients' scripts/run-base-details-live-cleanup.js

  apply:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: talk2me-uat
      url: https://talk2me.uent.co.za
    env:
      SSH_HOST: 164.160.91.40
      SSH_PORT: '41414'
      SSH_USER: uent
      SITE_URL: https://talk2me.uent.co.za
      NODE_BIN: /opt/alt/alt-nodejs20/root/usr/bin/node
      ELITEHOST_SSH_PRIVATE_KEY: ${{ secrets.ELITEHOST_SSH_PRIVATE_KEY }}
      ELITEHOST_SSH_KEY_PASSPHRASE: ${{ secrets.ELITEHOST_SSH_KEY_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v6
      - name: Configure encrypted SSH key
        run: bash scripts/setup-elitehost-ssh.sh
      - name: Wait for exact application commit
        timeout-minutes: 30
        run: |
          set -Eeuo pipefail
          for attempt in $(seq 1 120); do
            release="$(curl -fsS --connect-timeout 10 --max-time 20 "$SITE_URL/api/release" 2>/dev/null || true)"
            if RELEASE="$release" EXPECTED="$GITHUB_SHA" node - <<'NODE'
          try {
            const release = JSON.parse(process.env.RELEASE || '{}');
            process.exit(String(release.commit || '') === process.env.EXPECTED ? 0 : 1);
          } catch { process.exit(1); }
          NODE
            then
              echo "Exact application commit $GITHUB_SHA is live."
              exit 0
            fi
            sleep 15
          done
          exit 1
      - name: Verify deployed helper and run guarded cleanup
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" bash -s -- "$GITHUB_SHA" "$NODE_BIN" <<'REMOTE'
          set -Eeuo pipefail
          expected_sha="$1"
          node_bin="$2"
          app=/home/uent/talk2me.uent.co.za
          test "$(tr -d '[:space:]' < "$app/.deployed_commit")" = "$expected_sha"
          test -f "$app/scripts/run-base-details-live-cleanup.js"
          cd "$app"
          "$node_bin" scripts/run-base-details-live-cleanup.js "$expected_sha"
          REMOTE
      - name: Verify health and exact commit
        run: |
          set -Eeuo pipefail
          health="$(curl -fsS --connect-timeout 10 --max-time 25 "$SITE_URL/api/health")"
          release="$(curl -fsS --connect-timeout 10 --max-time 25 "$SITE_URL/api/release")"
          HEALTH="$health" RELEASE="$release" EXPECTED="$GITHUB_SHA" node - <<'NODE'
          const health = JSON.parse(process.env.HEALTH || '{}');
          const release = JSON.parse(process.env.RELEASE || '{}');
          if (health.status !== 'ok' || String(release.commit || '') !== process.env.EXPECTED) process.exit(1);
          NODE
